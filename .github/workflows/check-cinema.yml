name: Cinema Ticket Alert (Avengers Doomsday)

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      send_test:
        description: '테스트 알림 보내기 (true/false)'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  check-ticket:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Lotte Cinema & Megabox
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SEND_TEST_ON_MANUAL: ${{ github.event.inputs.send_test == 'true' && '1' || '0' }}
        run: python check_cinema.py

      - name: Save notified state if changed
        run: |
          if [ -n "$(git status --porcelain notified_state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add notified_state.json
            git commit -m "Update notified_state.json"
            git push
          fi
